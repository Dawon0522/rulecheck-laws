name: 법령 원문 일일 재확인

on:
  schedule:
    # 매일 한국시간 새벽 4시 (UTC 19:00 = 전날)
    - cron: "0 19 * * *"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 조문 원문 재확인
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: node scripts/snapshot.mjs

      - name: 변경사항 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/snapshot.json || true
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "법령 원문 재확인 $(date -u '+%Y-%m-%d')"
            git push
          fi
